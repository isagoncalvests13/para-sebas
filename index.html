<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amor Sebastián ❤️</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            text-align: center;
            padding: 20px;
        }

        .contenedor-principal {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.5em;
            color: #e91e63;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .boton {
            background: linear-gradient(45deg, #ff6b9d, #c44569);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            width: 100%;
        }

        .boton:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }

        .boton-volver {
            background: #666;
            font-size: 0.9em;
            margin-top: 25px;
            opacity: 0.8;
            width: auto;
            padding: 10px 20px;
        }

        #contenido {
            display: none;
            width: 100%;
        }

        #foto {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            border: 8px solid #ff6b9d;
            margin: 20px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: block;
            /* Se eliminó la rotación para dejarla como antes */
        }

        .mensaje-final {
            font-size: 1.5em;
            color: #e91e63;
            font-weight: bold;
            animation: fadeIn 1s ease-in;
            margin-top: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .corazon {
            font-size: 3em;
            animation: latido 1.5s infinite;
            display: inline-block;
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <div id="inicio">
            <div class="corazon">❤️</div>
            <h1>Sebastián</h1>
            <button class="boton" onclick="mostrarSaludo()">Hola mi amor, aprieta acá 😘</button>
            <button class="boton" onclick="mostrarFoto()">Mira a alguien que te ama mucho 👀</button>
        </div>

        <div id="contenido">
            <div id="saludo"></div>
            
            <img id="foto" src="portada.jpg.jpeg" alt="Tu amorcito">

            <div id="mensaje-final" class="mensaje-final">
                Tu niña que te ama demasiado 💕<br>
                <span style="font-size: 1.5em;">¡TE AMO! ❤️</span>
            </div>

            <button class="boton boton-volver" onclick="volverInicio()">⬅️ Volver</button>
        </div>
    </div>

    <script>
        function mostrarSaludo() {
            document.getElementById('inicio').style.display = 'none';
            document.getElementById('contenido').style.display = 'block';
            
            document.getElementById('saludo').innerHTML = '<h2 style="color: #e91e63; margin-top: 0;">¡Hola mi amor Sebastián! 😍<br> Quería recordarte que no importa cuántos kilómetros nos separen, cada pensamiento mío te pertenece, eres mi persona favorita, mi todo , y este pequeño detalle es solo un pedacito de todo el amor que te tengo. ¡Pronto estaremos juntos! Te amo mucho.</h2>';
            
            document.getElementById('foto').style.display = 'none';
            document.getElementById('mensaje-final').style.display = 'none';
        }

        function mostrarFoto() {
            document.getElementById('inicio').style.display = 'none';
            document.getElementById('contenido').style.display = 'block';
            
            document.getElementById('saludo').innerHTML = '<h2 style="color: #e91e63; margin-top: 0;">¡Mira quién es! 😍</h2>';
            
            document.getElementById('foto').style.display = 'block';
            document.getElementById('mensaje-final').style.display = 'block';
        }

        function volverInicio() {
            document.getElementById('inicio').style.display = 'block';
            document.getElementById('contenido').style.display = 'none';
        }
    </script>
</body>
</html>
